packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

minimumReleaseAgeExclude:
  - bullmq@6.0.2

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - bcrypt
  - esbuild
  - prisma
